# Business-schema migrations applied on top of the reviewed local SQL scripts
# (src/local/postgres/01_schema.sql ... 10_*.sql). The database URL comes from app.config.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
